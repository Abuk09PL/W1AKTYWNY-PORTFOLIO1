<div class="lightbox" id="lightbox">
<button class="lb-close" aria-label="Zamknij">×</button>
<button class="lb-prev" aria-label="Poprzednie">‹</button>
<img id="lb-img" alt="">
<button class="lb-next" aria-label="Następne">›</button>
</div>

<footer>
<div class="container">© 2026 W1AKTYWNY FOTO</div>
</footer>

<script src="../script.js"></script>

<script>
const items=[...document.querySelectorAll('.gallery-item')]
.filter(x=>getComputedStyle(x).display!=='none');

let current=0;

const lb=document.getElementById('lightbox');
const im=document.getElementById('lb-img');

function openLb(i){
if(!items.length)return;
current=(i+items.length)%items.length;
im.src=items[current].querySelector('img').src;
lb.classList.add('open');
}

items.forEach((x,i)=>x.addEventListener('click',()=>openLb(i)));

document.querySelector('.lb-close').onclick=()=>lb.classList.remove('open');
document.querySelector('.lb-prev').onclick=()=>openLb(current-1);
document.querySelector('.lb-next').onclick=()=>openLb(current+1);

document.addEventListener('keydown',e=>{
if(e.key==='Escape')lb.classList.remove('open');
if(e.key==='ArrowLeft')openLb(current-1);
if(e.key==='ArrowRight')openLb(current+1);
});

lb.addEventListener('click',e=>{
if(e.target===lb)lb.classList.remove('open');
});
</script>
